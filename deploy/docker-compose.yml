# =============================================================================
# CLIPFORGE backend - local + staging orchestration.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   curl localhost:8000/health
#
# Production: Railway/Render build the image themselves (see DEPLOY.md). This
# file is for local validation and single-VM deploys.
# =============================================================================
services:
  clipforge:
    # Build context is the backend dir (where main.py / app/ / requirements.txt
    # live). The Dockerfile itself lives in deploy/.
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    image: clipforge:latest
    container_name: clipforge
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env.example          # copy to .env and edit for local secrets
    environment:
      PORT: "8000"
      CLIPFORGE_ENV: "${CLIPFORGE_ENV:-development}"
      # rembg model weights persist on the named volume below
      U2NET_HOME: "/data/models"
      CLIPFORGE_DB_PATH: "/data/clipforge.db"
    volumes:
      - clipforge_data:/data   # model cache + SQLite usage db survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT','8000'), timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    # friendly log prefix
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clipforge_data:
